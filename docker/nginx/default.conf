# O formato omite query strings, cookies e cabecalhos de autenticacao.
log_format laboratorio '$remote_addr $request_method $uri $status';

server {
    listen 80;
    server_name localhost;
    access_log /dev/stdout laboratorio;

    location / {
        proxy_pass http://dvwa:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
